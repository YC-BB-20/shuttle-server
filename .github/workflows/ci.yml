name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet (linux, darwin)
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=amd64 go vet ./...
      - name: go test
        run: go test ./...
      - name: XXH128 and XXH64 cross-check against the official xxhsum
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xxhash
          xxhsum --version 2>&1 | head -1
          go build -o ss ./cmd/shuttle-server
          mkdir t
          for n in 0 1 2 3 4 7 8 9 15 16 17 32 33 64 65 96 97 127 128 129 159 160 191 192 239 240 241 255 256 257 1023 1024 1025 2047 2048 4096 65535 65536 1000003 4194304 4194305 33554433; do
            head -c $n /dev/urandom > t/f$n
          done
          ./ss hash t/* > ours.txt
          xxhsum -H2 t/* > theirs.txt
          diff ours.txt theirs.txt && echo "All $(wc -l < ours.txt) files match xxhsum -H2"
          ./ss hash -H1 t/* > ours64.txt
          xxhsum -H1 t/* > theirs64.txt
          diff ours64.txt theirs64.txt && echo "All $(wc -l < ours64.txt) files match xxhsum -H1 (XXH64)"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/YC-BB-20/shuttle-server/internal/version.Commit=${GITHUB_SHA::7}" -o dist/shuttle-server ./cmd/shuttle-server
      # Same certificate on every release, so macOS sees one app across updates
      # and keeps the drive permissions the owner already allowed. Without the
      # secrets (pull requests, forks) the build keeps Go's own ad-hoc signature.
      # The key and password reach rcodesign as files, never on a command line.
      - name: sign (macOS binaries)
        if: matrix.goos == 'darwin'
        env:
          P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          SIGNER_TOOL_VERSION: "0.29.0"
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::notice::No signing certificate in this run: binary keeps its ad-hoc signature (macOS will ask for drive permission again after an update)."
            exit 0
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/sign"
          printf %s "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/sign/cert.p12"
          printf %s "$P12_PASSWORD" > "$RUNNER_TEMP/sign/pass.txt"
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${SIGNER_TOOL_VERSION}/apple-codesign-${SIGNER_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP/sign" --strip-components=1
          ls -A "$RUNNER_TEMP/sign"
          # rcodesign reads a settings file from the folder it runs in and from the home folder;
          # run it from empty ones so nothing else can change how it signs.
          mkdir -p "$RUNNER_TEMP/empty-cwd" "$RUNNER_TEMP/empty-home"
          cd "$RUNNER_TEMP/empty-cwd"
          export HOME="$RUNNER_TEMP/empty-home" XDG_CONFIG_HOME="$RUNNER_TEMP/empty-home"
          BIN="$GITHUB_WORKSPACE/dist/shuttle-server"
          "$RUNNER_TEMP/sign/rcodesign" sign \
            --p12-file "$RUNNER_TEMP/sign/cert.p12" \
            --p12-password-file "$RUNNER_TEMP/sign/pass.txt" \
            --binary-identifier com.yc-bb-20.shuttle-server \
            "$BIN"
          # The line below must be identical on every release: it is what macOS remembers.
          "$RUNNER_TEMP/sign/rcodesign" print-signature-info "$BIN" | grep -E "Identifier|SHA-256|Subject CN|designated" || true
          rm -rf "$RUNNER_TEMP/sign" "$RUNNER_TEMP/empty-cwd" "$RUNNER_TEMP/empty-home"
      - name: archive
        # tar keeps the executable bit, which an artifact zip would lose
        run: tar -czf shuttle-server-${GOOS}-${GOARCH}.tar.gz -C dist shuttle-server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: shuttle-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shuttle-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: 90
